<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sundaram Finance — Leasing Enquiry Generation System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; overflow: hidden; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F2F5; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F0F2F5; }
    ::-webkit-scrollbar-thumb { background: #C4CDD8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #8896A9; }
    button:hover { filter: brightness(1.07); }
    input:focus, select:focus { border-color: #002060 !important; outline: none !important; box-shadow: 0 0 0 3px rgba(0,32,96,0.08); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Data layer -->
  <script type="text/babel" src="components/data.jsx"></script>

  <!-- UI Components -->
  <script type="text/babel" src="components/shell.jsx"></script>
  <script type="text/babel" src="components/dashboard.jsx"></script>
  <script type="text/babel" src="components/leads.jsx"></script>
  <script type="text/babel" src="components/prospects.jsx"></script>
  <script type="text/babel" src="components/opportunities.jsx"></script>
  <script type="text/babel" src="components/applications.jsx"></script>

  <!-- Main App -->
  <script type="text/babel">
    function App() {
      const [page, setPage] = React.useState('dashboard');
      const [role, setRole] = React.useState('field_officer');

      const renderPage = () => {
        switch(page) {
          case 'dashboard':    return <Dashboard setPage={setPage} role={role} />;
          case 'leads':        return <LeadsPage setPage={setPage} role={role} />;
          case 'prospects':    return <ProspectsPage setPage={setPage} role={role} />;
          case 'opportunities':return <OpportunitiesPage setPage={setPage} role={role} />;
          case 'quotes':       return <QuotesPage setPage={setPage} role={role} />;
          case 'applications': return <ApplicationsPage setPage={setPage} role={role} />;
          case 'customers':    return <CustomersPage setPage={setPage} role={role} />;
          default:             return <Dashboard setPage={setPage} role={role} />;
        }
      };

      return (
        <AppShell page={page} setPage={setPage} role={role} setRole={setRole}>
          {renderPage()}
        </AppShell>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
