# ============================================================
# Lead Service — Application Configuration (Spring Boot 3.3)
# ============================================================

spring.application.name=lead-service

# -------------------------------------------------------
# Database (PostgreSQL)
# -------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/leasing_db
spring.datasource.username=leasing_user
spring.datasource.password=leasing_pass
spring.datasource.hikari.maximum-pool-size=20

# -------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------
# Flyway
# -------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------
# Redis
# -------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# -------------------------------------------------------
# Kafka
# -------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka topic names
kafka.topics.lead-events=leasing.lead.events
kafka.topics.customer-events=leasing.customer.events
kafka.topics.opportunity-events=leasing.opportunity.events
kafka.topics.lms-updates=leasing.lms.updates

# -------------------------------------------------------
# OpenAPI / Swagger UI
# -------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=Lead Management API
springdoc.info.version=1.0.0
springdoc.info.description=SME Leasing Originations — Lead through Customer Creation

# -------------------------------------------------------
# HTTP
# -------------------------------------------------------
server.port=8080

# -------------------------------------------------------
# Phase 2 — Bulk Ingestion
# -------------------------------------------------------
bulk.batch-size=100

# -------------------------------------------------------
# Phase 2 — Temperature Engine (LP7)
# -------------------------------------------------------
temperature.hot-warn-days=7
temperature.warm-cold-days=14
temperature.unanswered-closure-threshold=5

# -------------------------------------------------------
# Phase 2 — Lead Qualification (LP8)
# -------------------------------------------------------
qualification.active-lease-block-enabled=false
qualification.nri-passport-min-days=90

# -------------------------------------------------------
# Phase 2 — External Adapters (stub mode = true for dev/test)
# -------------------------------------------------------
adapters.caution-list.stub-mode=true
adapters.ucic.stub-mode=true
adapters.pan-dedup.stub-mode=true

# -------------------------------------------------------
# Phase 3 — KYC Validation Adapters
# -------------------------------------------------------
adapters.pan-validation.stub-mode=true
adapters.gstin-validation.stub-mode=true

# -------------------------------------------------------
# Phase 3 — Prospect Validation SLA
# -------------------------------------------------------
prospect.validation-failure-sla-hours=24

# -------------------------------------------------------
# Phase 4 — Opportunity, Quote & Application (PP5-PP7)
# -------------------------------------------------------
env.indicator=T
adapters.dms.stub-mode=true
adapters.dms.url.test=https://dms-test.internal
adapters.dms.url.beta=https://dms-beta.internal
adapters.dms.url.live=https://dms-live.internal
adapters.product-price.stub-mode=true
adapters.hunter-sherlock.stub-mode=true
fraud-service.active=true
adapters.cibil.stub-mode=true
adapters.cibil.base-url=https://cibil.stub.local
application.sanction-validity-days=180
application.eligible-lease-types=FINANCE_LEASE,OPERATING_LEASE
