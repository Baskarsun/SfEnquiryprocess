# ============================================================
# Lead Service — Application Configuration
# ============================================================

quarkus.application.name=lead-service
quarkus.application.version=1.0.0-SNAPSHOT

# -------------------------------------------------------
# Database (PostgreSQL)
# -------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=leasing_user
quarkus.datasource.password=leasing_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5434/leasing_db
quarkus.datasource.jdbc.max-size=20

# -------------------------------------------------------
# Flyway
# -------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# -------------------------------------------------------
# Hibernate ORM
# -------------------------------------------------------
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# -------------------------------------------------------
# Redis
# -------------------------------------------------------
quarkus.redis.hosts=redis://localhost:6379

# -------------------------------------------------------
# Kafka
# -------------------------------------------------------
kafka.bootstrap.servers=localhost:9092

# Lead events outbound topic
mp.messaging.outgoing.lead-events.connector=smallrye-kafka
mp.messaging.outgoing.lead-events.topic=leasing.lead.events
mp.messaging.outgoing.lead-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# -------------------------------------------------------
# OpenAPI / Swagger UI
# -------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Lead Management API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Phase 5: Customer Creation, Lineage & Downstream Integration — PP8

# -------------------------------------------------------
# HTTP
# -------------------------------------------------------
quarkus.http.port=8080

# -------------------------------------------------------
# Dev profile overrides
# -------------------------------------------------------
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5434/leasing_db
%dev.quarkus.redis.hosts=redis://localhost:6379
%dev.kafka.bootstrap.servers=localhost:9092

# -------------------------------------------------------
# Phase 2 — Bulk Ingestion
# -------------------------------------------------------
bulk.batch-size=100

# -------------------------------------------------------
# Phase 2 — Temperature Engine (LP7)
# -------------------------------------------------------
temperature.hot-warn-days=7
temperature.warm-cold-days=14
temperature.unanswered-closure-threshold=5

# -------------------------------------------------------
# Phase 2 — Lead Qualification (LP8)
# -------------------------------------------------------
qualification.active-lease-block-enabled=false
qualification.nri-passport-min-days=90

# -------------------------------------------------------
# Phase 2 — External Adapters (stub mode = true for dev/test)
# -------------------------------------------------------
adapters.caution-list.stub-mode=true
adapters.ucic.stub-mode=true
adapters.pan-dedup.stub-mode=true

# -------------------------------------------------------
# Phase 3 — KYC Validation Adapters
# -------------------------------------------------------
adapters.pan-validation.stub-mode=true
adapters.gstin-validation.stub-mode=true

# -------------------------------------------------------
# Phase 3 — Prospect Validation SLA
# -------------------------------------------------------
prospect.validation-failure-sla-hours=24

# -------------------------------------------------------
# Phase 4 — Opportunity, Quote & Application (PP5-PP7)
# -------------------------------------------------------

# Environment indicator for DMS routing: T=Test, B=Beta, L=Live
env.indicator=T

# DMS endpoint URLs (injected from Key Vault in production)
adapters.dms.stub-mode=true
adapters.dms.url.test=https://dms-test.internal
adapters.dms.url.beta=https://dms-beta.internal
adapters.dms.url.live=https://dms-live.internal

# Product Price Service
adapters.product-price.stub-mode=true

# Fraud Screening (Hunter + Sherlock)
adapters.hunter-sherlock.stub-mode=true
fraud-service.active=true

# CIBIL
adapters.cibil.stub-mode=true
adapters.cibil.base-url=https://cibil.stub.local

# Application rules
application.sanction-validity-days=180
application.eligible-lease-types=FINANCE_LEASE,OPERATING_LEASE

# -------------------------------------------------------
# Phase 5 — Customer Creation & Downstream (PP8)
# -------------------------------------------------------

# Downstream Kafka topics for CustomerCreated event consumers
mp.messaging.outgoing.customer-events.connector=smallrye-kafka
mp.messaging.outgoing.customer-events.topic=leasing.customer.events
mp.messaging.outgoing.customer-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Downstream Kafka topics for Opportunity Won
mp.messaging.outgoing.opportunity-events.connector=smallrye-kafka
mp.messaging.outgoing.opportunity-events.topic=leasing.opportunity.events
mp.messaging.outgoing.opportunity-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# LMS update topic
mp.messaging.outgoing.lms-updates.connector=smallrye-kafka
mp.messaging.outgoing.lms-updates.topic=leasing.lms.updates
mp.messaging.outgoing.lms-updates.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# -------------------------------------------------------
# Test profile overrides
# -------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:leasing_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.enabled=false
%test.quarkus.redis.hosts=redis://localhost:6379
%test.mp.messaging.outgoing.lead-events.connector=smallrye-in-memory
%test.mp.messaging.outgoing.customer-events.connector=smallrye-in-memory
%test.mp.messaging.outgoing.opportunity-events.connector=smallrye-in-memory
%test.mp.messaging.outgoing.lms-updates.connector=smallrye-in-memory
