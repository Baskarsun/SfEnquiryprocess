# ============================================================
# Lead Service — Test Configuration (Spring Boot 3.3)
# ============================================================

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:leasing_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092

kafka.topics.lead-events=leasing.lead.events.test
kafka.topics.customer-events=leasing.customer.events.test
kafka.topics.opportunity-events=leasing.opportunity.events.test
kafka.topics.lms-updates=leasing.lms.updates.test
